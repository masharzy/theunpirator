services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: unpirator
      POSTGRES_USER: unpirator
      POSTGRES_PASSWORD: unpirator
    ports: ["${POSTGRES_PORT:-55432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      { test: ["CMD-SHELL", "pg_isready -U unpirator"], interval: 5s, timeout: 3s, retries: 20 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-56379}:6379"]
    volumes: ["redis_data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://unpirator:unpirator@postgres:5432/unpirator
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  dashboard:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args: { NEXT_PUBLIC_API_URL: http://localhost:4000 }
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  postgres_data:
  redis_data:
