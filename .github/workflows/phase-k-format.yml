name: Phase K formatter

on:
  push:
    branches:
      - phase-k-work

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/routes/asset-console.js apps/api/src/routes/session-console.js apps/api/src/services/list-query.js apps/api/src/services/operations-log.js apps/dashboard/app/dashboard/assets/page.js apps/dashboard/app/dashboard/sessions/page.js
      - uses: actions/upload-artifact@v4
        with:
          name: phase-k-formatted
          path: |
            apps/api/src/routes/asset-console.js
            apps/api/src/routes/session-console.js
            apps/api/src/services/list-query.js
            apps/api/src/services/operations-log.js
            apps/dashboard/app/dashboard/assets/page.js
            apps/dashboard/app/dashboard/sessions/page.js
