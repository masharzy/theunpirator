name: Format quota changes once
on:
  push:
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/api/src/routes/quota-internal.js
          apps/api/src/routes/usage.js
          apps/api/src/services/quotas.js
          apps/api/test/quotas.test.js
          workers/media-gateway/src/protected-media.js
          workers/media-gateway/src/proxy.js
          workers/media-gateway/src/quota.js
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/routes/quota-internal.js apps/api/src/routes/usage.js apps/api/src/services/quotas.js apps/api/test/quotas.test.js workers/media-gateway/src/protected-media.js workers/media-gateway/src/proxy.js workers/media-gateway/src/quota.js
          git commit -m "style: format quota enforcement changes"
          git push
