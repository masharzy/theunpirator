name: Phase M format

on:
  push:
    branches:
      - phase-m-webhooks

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase M files
        run: >-
          pnpm exec prettier --write
          apps/api/src/routes/webhooks.js
          apps/dashboard/app/dashboard/webhooks/page.js
          packages/contracts/src/index.js
          packages/contracts/test/validation.test.js
          packages/db/migrations/0014_webhook_console.sql
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/routes/webhooks.js apps/dashboard/app/dashboard/webhooks/page.js packages/contracts/src/index.js packages/contracts/test/validation.test.js packages/db/migrations/0014_webhook_console.sql
          git commit -m "chore: apply phase m prettier output"
          git push
