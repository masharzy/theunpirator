name: One-shot prettier fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-prettier-fix.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format failed files
        run: |
          pnpm exec prettier --write \
            apps/dashboard/app/docs/docs-client.jsx \
            apps/dashboard/app/docs/docs-rewrite.css \
            apps/dashboard/app/docs/page.js \
            apps/dashboard/app/globals.css \
            integrations/nextjs/index.js \
            integrations/nextjs/README.md

      - run: pnpm format:check

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "chatgpt-docs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/dashboard/app/docs/docs-client.jsx \
            apps/dashboard/app/docs/docs-rewrite.css \
            apps/dashboard/app/docs/page.js \
            apps/dashboard/app/globals.css \
            integrations/nextjs/index.js \
            integrations/nextjs/README.md
          git commit -m "style: format docs and integration files"
          git push origin HEAD:main
