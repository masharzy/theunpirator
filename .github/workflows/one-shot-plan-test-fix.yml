name: One-shot plan integration test fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-plan-test-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Update integration fixture for plan entitlement
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('apps/api/test/integration.test.js')
          s = p.read_text()
          s = s.replace(
              '  featureFlags,\n  siteDomains,\n  subscriptions,',
              '  featureFlags,\n  plans,\n  siteDomains,\n  subscriptions,',
              1,
          )
          needle = '  it("creates and reuses an internal YouTube asset on demand", async () => {\n'
          insert = '''  it("creates and reuses an internal YouTube asset on demand", async () => {\n    const [subscription] = await database.db\n      .select()\n      .from(subscriptions)\n      .where(eq(subscriptions.tenantId, tenant))\n      .limit(1);\n    const [plan] = await database.db\n      .select()\n      .from(plans)\n      .where(eq(plans.id, subscription.planId))\n      .limit(1);\n    await database.db\n      .update(plans)\n      .set({\n        entitlements: {\n          ...(plan.entitlements || {}),\n          youtube_custom: true,\n          protected_delivery: true,\n        },\n      })\n      .where(eq(plans.id, plan.id));\n'''
          if needle not in s:
              raise SystemExit('YouTube integration test marker not found')
          s = s.replace(needle, insert, 1)
          p.write_text(s)
          PY
          pnpm exec prettier --write apps/api/test/integration.test.js
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "chatgpt-plan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/test/integration.test.js
          git commit -m "test: enable YouTube through plan entitlements"
          git push origin HEAD:main
