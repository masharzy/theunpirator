name: One-shot docs hero v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-docs-hero-v2.yml'

permissions:
  contents: write

jobs:
  update-docs-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update docs hero copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/dashboard/app/docs/docs-client.jsx')
          text = path.read_text(encoding='utf-8')

          old = '''          <h1>\n            Private video.\n            <br /> Protected playback.\n          </h1>\n          <p>\n            Keep source URLs on your server. Pass the player a playbackRef, authorize the viewer,\n            and let Unpirator handle protected delivery.\n          </p>'''

          new = '''          <h1>\n            Your videos stay yours.\n            <br /> Playback stays protected.\n          </h1>\n          <p>\n            Keep the source on your server. Unpirator handles protected playback.\n          </p>'''

          if old not in text:
              raise SystemExit('Expected current docs hero block was not found; refusing to edit.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "chatgpt-docs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dashboard/app/docs/docs-client.jsx
          git commit -m "style: refine docs hero copy"
          git push origin HEAD:main
