name: Add subscription admin controls

on:
  push:
    paths:
      - ".github/workflows/add-subscription-admin-controls.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply backend patch
        run: python scripts/patch-subscription-admin.py
      - name: Commit backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/routes/admin-commerce.js
          git diff --cached --check
          git commit -m "feat: add admin subscription revoke controls"
          git push origin HEAD:main
