name: Publish media gateway image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.media-gateway
      - pnpm-lock.yaml
      - workers/media-gateway/**
      - packages/cache/**
      - providers/restricted/youtube-custom/**
      - .github/workflows/publish-media-gateway.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/the-unpirator-media-gateway
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.media-gateway
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GATEWAY_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update Bunny Magic Container
        if: ${{ vars.BUNNY_MAGIC_APP_ID != '' }}
        uses: BunnyWay/actions/container-update-image@main
        with:
          app_id: ${{ vars.BUNNY_MAGIC_APP_ID }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: gateway
          image_tag: latest
