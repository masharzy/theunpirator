name: Publish npm packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @unpirator/player test
      - name: Publish packages in dependency order
        shell: bash
        run: |
          publish_package() {
            package="$1"
            version=$(pnpm --filter "$package" exec node -p "require('./package.json').version")
            if npm view "$package@$version" version >/dev/null 2>&1; then
              echo "$package@$version already exists; skipping"
              return
            fi
            pnpm --filter "$package" publish --access public --no-git-checks
          }

          publish_package @unpirator/player
          publish_package @unpirator/sdk-js
          publish_package @unpirator/web-component
          publish_package @unpirator/react
          publish_package @unpirator/integration-nextjs
