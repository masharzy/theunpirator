name: Publish npm packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @unpirator/player test
      - run: pnpm --filter @unpirator/player publish --access public --no-git-checks
      - run: pnpm --filter @unpirator/sdk-js publish --access public --no-git-checks
      - run: pnpm --filter @unpirator/web-component publish --access public --no-git-checks
      - run: pnpm --filter @unpirator/react publish --access public --no-git-checks
      - run: pnpm --filter @unpirator/integration-nextjs publish --access public --no-git-checks
