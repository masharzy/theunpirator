name: Format once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier output
        run: |
          pnpm exec prettier --write \
            apps/api/src/routes/usage.js \
            apps/dashboard/app/dashboard/page.js \
            apps/dashboard/app/dashboard/usage/page.js \
            apps/dashboard/components/dashboard-shell.jsx
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/routes/usage.js apps/dashboard/app/dashboard/page.js apps/dashboard/app/dashboard/usage/page.js apps/dashboard/components/dashboard-shell.jsx
          git commit -m "style: format dashboard usage changes"
          git push
