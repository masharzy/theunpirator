name: One-shot plan feature migration retry

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-plan-features-fix.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unpirator
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply plan feature migration
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/one-shot-plan-features.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script = []
          for line in workflow[start:end]:
              script.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/plan_features.py').write_text('\n'.join(script) + '\n')
          PY
          python /tmp/plan_features.py
          python <<'PY'
          from pathlib import Path
          p = Path('packages/contracts/test/validation.test.js')
          s = p.read_text()
          s = s.replace('      securityPolicy: "strict",\n', '')
          p.write_text(s)
          PY

      - name: Format
        run: pnpm exec prettier --write apps packages workers docs integrations

      - name: Local verification
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/unpirator
          REDIS_URL: redis://localhost:6379
        run: |
          node scripts/setup-local.js
          pnpm db:migrate
          pnpm check:syntax
          pnpm format:check
          pnpm lint
          pnpm test
          pnpm --filter @unpirator/dashboard build
          pnpm --filter @unpirator/media-gateway build
          echo "Remaining legacy level references:"
          grep -RniE "securityPolicy|max_security_policy|defaultSecurityPolicy|effectiveSecurityPolicy" apps packages workers docs integrations || true

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "chatgpt-plan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps packages workers docs integrations
          git commit -m "feat: make protection fully plan-driven"
          git push origin HEAD:main
