name: Phase E format

on:
  push:
    branches:
      - phase-e-format

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix lint and format Phase E files
        run: |
          sed -i '/refreshNonce intentionally forces a reload without changing filters\./d' apps/dashboard/app/dashboard/security/page.js
          sed -i '/eslint-disable-next-line react-hooks\/exhaustive-deps/d' apps/dashboard/app/dashboard/security/page.js
          pnpm exec prettier --write apps/api/src/routes/security-console.js apps/dashboard/app/dashboard/security/page.js
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/routes/security-console.js apps/dashboard/app/dashboard/security/page.js
          git commit -m "chore: fix phase e lint"
          git push
