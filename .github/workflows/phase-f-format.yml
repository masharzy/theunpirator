name: Phase F format

on:
  push:
    branches:
      - phase-f-format

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase F file
        run: pnpm exec prettier --write apps/dashboard/app/dashboard/plans/page.js
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dashboard/app/dashboard/plans/page.js
          git commit -m "chore: apply phase f prettier output"
          git push
