name: Adjust concurrency fixture once
on:
  push:
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/test/integration.test.js')
          text = path.read_text()
          old = '        max_concurrent_streams: 1,\n'
          new = '        max_concurrent_streams: 3,\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one fixture occurrence, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/test/integration.test.js
          git commit -m "test: align fixture with workspace concurrency" || exit 0
          git push
