name: CI
on:
  push:

permissions:
  contents: write

jobs:
  format-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Commit formatted source when needed
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src apps/dashboard/app apps/dashboard/components packages/contracts/src packages/db/src packages/db/migrations
          git commit -m "style: format source with Prettier"
          git push
