name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: unpirator_test
          POSTGRES_USER: unpirator
          POSTGRES_PASSWORD: unpirator
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U unpirator -d unpirator_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://unpirator:unpirator@localhost:5432/unpirator_test
      TEST_DATABASE_URL: postgresql://unpirator:unpirator@localhost:5432/unpirator_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/setup-local.js
      - run: pnpm db:migrate
      - run: pnpm check:syntax
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @unpirator/dashboard build
      - run: pnpm --filter @unpirator/media-gateway build
      - run: pnpm --filter @unpirator/dashboard exec playwright install --with-deps chromium
      - name: Browser verification
        run: |
          node apps/api/src/server.js > /tmp/unpirator-api.log 2>&1 &
          pnpm --filter @unpirator/dashboard start > /tmp/unpirator-dashboard.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:3100 > /dev/null && curl --fail --silent http://localhost:4100/health/ready > /dev/null; then break; fi
            sleep 2
          done
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: apps/dashboard/test-results
