name: CI

on: push

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/create-app.js apps/dashboard/app/dashboard/audit/page.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/create-app.js apps/dashboard/app/dashboard/audit/page.js
          git diff --cached --quiet && exit 0
          git commit -m "chore: apply phase i prettier output"
          git push
