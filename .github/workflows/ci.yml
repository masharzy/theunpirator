name: Phase J formatter

on:
  push:
    branches:
      - phase-j-format

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/dashboard/app/dashboard/billing/page.js apps/dashboard/app/dashboard/plans/page.js
      - uses: actions/upload-artifact@v4
        with:
          name: phase-j-formatted
          path: |
            apps/dashboard/app/dashboard/billing/page.js
            apps/dashboard/app/dashboard/plans/page.js
