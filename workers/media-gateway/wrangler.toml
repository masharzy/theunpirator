name = "the-unpirator-media-gateway"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

[vars]
REQUIRE_SESSION_STATE = "true"
REQUIRE_ORIGIN = "true"

[[durable_objects.bindings]]
name = "SESSION_STATE"
class_name = "SessionState"

[[migrations]]
tag = "v1"
new_classes = ["SessionState"]

# Source and rewritten-HLS mapping cache only.
[[kv_namespaces]]
binding = "SOURCE_CACHE"
id = "00000000000000000000000000000000"

# Secrets (wrangler secret put ...):
# PLAYBACK_PUBLIC_KEYS_B64
# GATEWAY_CONTROL_SECRET
# INTERNAL_API_URL
# GATEWAY_INTERNAL_SECRET
