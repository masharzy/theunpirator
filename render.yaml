# Render Blueprint — free-tier hosting for the control API.
#
# This is an alternative to the VPS topology in docs/DEPLOYMENT.md, not a
# replacement: the same `node apps/api/src/server.js` command runs on a VPS
# (see infra/ for systemd/PM2/Docker), and switching is an env-var change.
# Runbook: docs/DEPLOYMENT-FREE.md. VPS switch-over: docs/VPS-MIGRATION.md.

services:
  - type: web
    name: unpirator-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm db:migrate
    startCommand: node apps/api/src/server.js
    healthCheckPath: /health/live
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render routes external traffic to this port on free plans.
      - key: API_PORT
        value: "10000"
      # --- Fill these in the Render dashboard (or via `render blueprint launch`) ---
      - key: DATABASE_URL
        sync: false # Neon connection string
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: APP_ENCRYPTION_KEY_BASE64
        sync: false # openssl rand -base64 32
      - key: SIGNING_KEYS_B64
        sync: false # pnpm keys:generate
      - key: ACTIVE_SIGNING_KID
        sync: false
      - key: GATEWAY_INTERNAL_SECRET
        sync: false # openssl rand -hex 32
      - key: GATEWAY_CONTROL_SECRET
        sync: false # openssl rand -hex 32
      - key: GATEWAY_PUBLIC_URL
        sync: false # https://<worker>.workers.dev
      - key: GATEWAY_CONTROL_URL
        sync: false # same as GATEWAY_PUBLIC_URL
      - key: API_PUBLIC_URL
        sync: false # https://unpirator-api.onrender.com
      - key: DASHBOARD_URL
        sync: false # https://<dashboard>.vercel.app
      - key: COOKIE_DOMAIN
        sync: false # e.g. .theunpirator.com, empty for onrender.com/vercel.app
